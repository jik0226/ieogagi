# CI for Ieogagi: security scan, backend tests (PostgreSQL), frontend lint/build/audit.
# Every action is pinned to a full commit SHA (the tag is in the trailing comment).
# To bump one: gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security-scan:
    name: Security scan (ruff, bandit, semgrep, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install -e backend --no-deps
          mkdir -p security/reports/ci

      - name: ruff
        run: ruff check backend --output-format concise | tee security/reports/ci/ruff.txt

      - name: bandit
        if: ${{ !cancelled() }}
        run: bandit -r backend/app -c backend/pyproject.toml -f txt | tee security/reports/ci/bandit.txt

      - name: Semgrep rule self-test
        if: ${{ !cancelled() }}
        run: semgrep --metrics=off --disable-version-check --test --config security/semgrep security/semgrep/tests

      - name: Semgrep custom rules
        if: ${{ !cancelled() }}
        run: >-
          semgrep --config security/semgrep --error --metrics=off --disable-version-check
          --json-output=security/reports/ci/semgrep-custom.json backend/app frontend/src

      - name: pip-audit (runtime dependencies)
        if: ${{ !cancelled() }}
        run: >-
          pip-audit -r backend/requirements.lock --progress-spinner off
          | tee security/reports/ci/pip-audit.txt

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: security/reports/ci
          if-no-files-found: ignore
          retention-days: 30

  backend-test:
    name: Backend tests (pytest + PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only throwaway database: no password is stored anywhere in this repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IEOGAGI_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ieogagi_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install -e backend --no-deps

      - name: Create test database
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ieogagi_test"

      - name: pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (eslint, build, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect frontend
        id: detect
        run: echo "present=${{ hashFiles('frontend/package.json') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: eslint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      - name: npm audit (runtime dependencies, high and above)
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
