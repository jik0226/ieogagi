[project]
name = "ieogagi"
version = "0.1.0"
description = "Ieogagi - handover notebook for community child center volunteer mentors"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit[toml]>=1.7.9",
    "semgrep>=1.85",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[project.scripts]
ieogagi-seed = "app.cli:seed_command"
ieogagi-dev-secrets = "app.cli:dev_secrets_command"
ieogagi-db-roles = "app.cli:db_roles_command"
ieogagi-export-openapi = "app.cli:export_openapi_command"
ieogagi-add-center = "app.cli:add_center_command"
ieogagi-cleanup = "app.cli:cleanup_command"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Security-relevant rule families are enabled on purpose:
#   S   = flake8-bandit (eval, hardcoded secrets, weak hashes, insecure random ...)
#   T20 = print / pprint left in code (debug code)
#   BLE = blind `except Exception`
#   ERA = commented-out code (may hide secrets or dead debug code)
#   TRY = exception handling anti-patterns
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "BLE", "ERA", "TRY", "SIM", "RET", "PL"]
ignore = [
    "TRY003",   # long messages in exception constructors are fine for our AppError
    "PLR0913",  # FastAPI handlers naturally take many injected params
    "PLR2004",  # magic values in comparisons are acceptable in validators
    "PLR0917",  # FastAPI injects dependencies as positional parameters
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]
"alembic/**" = ["ERA001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
