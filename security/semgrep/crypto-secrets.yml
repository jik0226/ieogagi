# Custom Semgrep rules for Ieogagi: security function family.
# KISA category: security functions (randomness, hashing, hard-coded secrets, TLS verification).
# Tests: tests/crypto-secrets.py
rules:
  - id: ieogagi-no-insecure-random
    languages: [python]
    severity: ERROR
    message: >-
      [적절하지 않은 난수 값 사용] random 모듈을 쓰지 마세요. 토큰·코드·솔트·ID 등 보안 값은
      secrets 모듈(secrets.token_urlsafe, secrets.choice 등)로 만드세요.
      / Do not use the random module. Generate security-relevant values
      (tokens, codes, salts, IDs) with the secrets module.
    metadata:
      kisa-category: 보안기능
      kisa-item: 적절하지 않은 난수 값 사용
      cwe:
        - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      confidence: HIGH
    pattern-either:
      - pattern: import random
      - pattern: import random as $ALIAS
      - pattern: from random import $NAME
      - pattern: from random import $NAME as $ALIAS

  - id: ieogagi-no-weak-hash
    languages: [python]
    severity: ERROR
    message: >-
      [취약한 암호화 알고리즘 사용 / 솔트 없이 일방향 해시 함수 사용] hashlib.md5·sha1 을 쓰지 마세요.
      비밀번호는 sha256 등을 직접 쓰지 말고 argon2id(argon2-cffi)로 솔트와 함께 해시하세요.
      / Do not use hashlib.md5 or sha1, and do not hash passwords directly with sha256 etc.
      Hash passwords with salted argon2id (argon2-cffi).
    metadata:
      kisa-category: 보안기능
      kisa-item: 취약한 암호화 알고리즘 사용 / 솔트 없이 일방향 해시 함수 사용
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
        - "CWE-328: Use of Weak Hash"
        - "CWE-759: Use of a One-Way Hash without a Salt"
      confidence: HIGH
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^["'](md4|md5|sha1|sha-1|ripemd160)["']$
      - patterns:
          - pattern: hashlib.$H(<... $X ...>)
          - metavariable-regex:
              metavariable: $H
              regex: ^(sha224|sha256|sha384|sha512|sha3_224|sha3_256|sha3_384|sha3_512|blake2b|blake2s)$
          - metavariable-regex:
              metavariable: $X
              regex: (?i).*(passw|pwd|passcode).*
      - patterns:
          - pattern: hashlib.new($ALG, <... $X ...>)
          - metavariable-regex:
              metavariable: $X
              regex: (?i).*(passw|pwd|passcode).*

  - id: ieogagi-no-hardcoded-secret
    languages: [python]
    severity: ERROR
    message: >-
      [하드코드된 중요정보] password/secret/api_key/token/private_key 이름의 변수·인자·딕셔너리 키에 문자열(bytes, 자리표시자 없는 f-string 포함) 리터럴을 넣지 마세요.
      환경변수나 Docker secret 파일에서 읽으세요. (빈 문자열은 허용)
      / Do not assign string literals (including bytes and placeholder-free f-strings) to variables, arguments or dict keys
      named like password/secret/api_key/token/private_key.
      Read them from environment variables or Docker secret files. (An empty string is allowed.)
    metadata:
      kisa-category: 보안기능
      kisa-item: 하드코드된 중요정보
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
          - pattern: '$NAME: $T = "..."'
          - pattern: $OBJ.$NAME = "..."
          - pattern: $FUNC(..., $NAME="...", ...)
          - pattern: 'def $F(..., $NAME="...", ...): ...'
          - pattern: 'def $F(..., $NAME: $T = "...", ...): ...'
          # Bytes literals.
          - pattern: $NAME = b"..."
          - pattern: '$NAME: $T = b"..."'
          - pattern: $OBJ.$NAME = b"..."
          - pattern: $FUNC(..., $NAME=b"...", ...)
          # f-strings: the placeholder-free ones are plain constants (placeholders are removed below).
          - pattern: $NAME = f"..."
          - pattern: '$NAME: $T = f"..."'
          - pattern: $OBJ.$NAME = f"..."
          - pattern: $FUNC(..., $NAME=f"...", ...)
          # Dict literals: the key string is bound to $NAME and goes through the same name filter.
          - pattern: '{..., "$NAME": "...", ...}'
          - pattern: '{..., "$NAME": b"...", ...}'
      - pattern-not: $NAME = ""
      - pattern-not: '$NAME: $T = ""'
      - pattern-not: $OBJ.$NAME = ""
      - pattern-not: $FUNC(..., $NAME="", ...)
      - pattern-not: 'def $F(..., $NAME="", ...): ...'
      - pattern-not: 'def $F(..., $NAME: $T = "", ...): ...'
      - pattern-not: $NAME = b""
      - pattern-not: '$NAME: $T = b""'
      - pattern-not: $OBJ.$NAME = b""
      - pattern-not: $FUNC(..., $NAME=b"", ...)
      - pattern-not: $NAME = f""
      - pattern-not: '$NAME: $T = f""'
      - pattern-not: $OBJ.$NAME = f""
      - pattern-not: $FUNC(..., $NAME=f"", ...)
      - pattern-not: '{..., "$NAME": "", ...}'
      - pattern-not: '{..., "$NAME": b"", ...}'
      # An f-string with at least one placeholder is a computed value, not a literal secret.
      - pattern-not: $NAME = f"...{$X}..."
      - pattern-not: '$NAME: $T = f"...{$X}..."'
      - pattern-not: $OBJ.$NAME = f"...{$X}..."
      - pattern-not: $FUNC(..., $NAME=f"...{$X}...", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|secret|api_?key|token|private_?key).*

  - id: ieogagi-no-tls-verify-off
    languages: [python]
    severity: ERROR
    message: >-
      [부적절한 인증서 유효성 검증] verify=False, 검증 없는 SSL 컨텍스트를 쓰지 마세요.
      인증서 검증은 항상 켠 채로 두세요 (이어가기는 외부로 나가는 HTTP 호출 자체가 없는 설계입니다).
      / Do not disable certificate verification (verify=False, unverified SSL contexts).
      Keep verification on. (Ieogagi makes no outbound HTTP calls by design.)
    metadata:
      kisa-category: 보안기능
      kisa-item: 부적절한 인증서 유효성 검증
      cwe:
        - "CWE-295: Improper Certificate Validation"
      confidence: HIGH
    pattern-either:
      - pattern: requests.$FUNC(..., verify=False, ...)
      - pattern: httpx.$FUNC(..., verify=False, ...)
      - pattern: $CLIENT.$FUNC(..., verify=False, ...)
      - pattern: $SESSION.verify = False
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
