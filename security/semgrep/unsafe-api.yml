# Custom Semgrep rules for Ieogagi: unsafe API family.
# KISA categories: code errors (deserialization), time and state (temporary file races).
# Tests: tests/unsafe-api.py
rules:
  - id: ieogagi-no-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      [신뢰할 수 없는 데이터의 역직렬화] pickle/marshal/shelve/dill, 안전하지 않은 yaml.load 를 쓰지 마세요.
      외부 데이터는 json 또는 Pydantic 모델 검증으로만 읽고, yaml 은 yaml.safe_load 를 쓰세요.
      / Do not use pickle, marshal, shelve, dill or an unsafe yaml.load.
      Read external data only via json or Pydantic validation, and use yaml.safe_load for YAML.
    metadata:
      kisa-category: 코드오류
      kisa-item: 신뢰할 수 없는 데이터의 역직렬화
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: pickle.Unpickler(...)
      - pattern: cPickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: dill.load(...)
      - pattern: dill.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
      - pattern: shelve.open(...)
      - pattern: jsonpickle.decode(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.unsafe_load_all(...)
      - pattern: yaml.full_load(...)
      - pattern: yaml.full_load_all(...)
      - patterns:
          - pattern-either:
              - pattern: yaml.load(...)
              - pattern: yaml.load_all(...)
          - pattern-not: yaml.$LOAD(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.$LOAD(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.$LOAD($S, yaml.SafeLoader)
          - pattern-not: yaml.$LOAD($S, yaml.CSafeLoader)

  - id: ieogagi-no-tempfile-mktemp
    languages: [python]
    severity: ERROR
    message: >-
      [경쟁조건: 검사 시점과 사용 시점] tempfile.mktemp 는 이름만 만들고 파일을 열지 않아 경쟁조건이 생깁니다.
      tempfile.NamedTemporaryFile 또는 tempfile.mkstemp 를 쓰세요.
      / tempfile.mktemp only returns a name without creating the file, which causes a race condition.
      Use tempfile.NamedTemporaryFile or tempfile.mkstemp.
    metadata:
      kisa-category: 시간 및 상태
      kisa-item: 경쟁조건 검사 시점과 사용 시점 (TOCTOU)
      cwe:
        - "CWE-377: Insecure Temporary File"
        - "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      confidence: HIGH
    pattern-either:
      - pattern: tempfile.mktemp(...)
      - pattern: os.tempnam(...)
      - pattern: os.tmpnam(...)
